[package]
name = "hypelights"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/HypeDriven/hypelights"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(windows)'.dependencies]
btleplug = "0.12"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time", "sync"] }
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Foundation_Collections", "Storage_Streams"] }
